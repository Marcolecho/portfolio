<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 3D - Git Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <section id="sidebar-container">
    <aside id="sidebar">
      <h2 id="title-sidebar">Explorateur</h2>
      <section id="file-explorer"></section>
    </aside>
  </section>

  <section id="modale-container">
    <section id="modale">
      <button class="close-btn" onclick="onCloseModale()">&times;</button>
      <section id="container-iframe"></section>
    </section>
  </section>

  <script>
    function onCloseModale(){
      const modaleContainer = document.getElementById("modale-container")
      modaleContainer.classList.remove('active');
      modaleContainer.classList.add('is-closing');
      document.getElementById("iframe-window").remove();
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
